<mat-card appearance="outlined" class="mt-3 mb-4">
  <!--mat-elevation-z8-->
  <mat-card-title class="m-3">Two-factor Authentication (2FA)</mat-card-title>
  <mat-card-content>
    <mat-slide-toggle class="mt-2"
                      [checked]="isTwoFaEnabled"
                      color="primary"
                      (change)="onEnabledChanged($event)">
      <span class="ms-2">{{ isTwoFaEnabledString }}</span>
    </mat-slide-toggle>

    <div *ngIf="isTwoFaEnabling">
      <app-enable-authenticator [email]="user.email" (authenticatorEnabled)="onAuthenticatorEnabled($event)"></app-enable-authenticator>
    </div>

  </mat-card-content>
</mat-card>
