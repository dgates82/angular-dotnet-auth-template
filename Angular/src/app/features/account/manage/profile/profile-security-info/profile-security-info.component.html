<div class="mt-3">
  <mat-card class="mt-3 mb-4">
    <!--mat-elevation-z8-->
    <mat-card-title>Password</mat-card-title>
    <mat-card-content>
      <div *ngIf="!isUpdatingPassword">
        <button mat-stroked-button color="primary" class="col-12 col-md-3 mt-3"
                (click)="updatePassword()">
          Update Password
        </button>
      </div>
      <div *ngIf="isUpdatingPassword">
        <app-update-password (passwordUpdated)="onPasswordUpdated($event)" (passwordUpdateCancelled)="onPasswordUpdateCancelled($event)"></app-update-password>
      </div>
    </mat-card-content>
  </mat-card>
</div>

<div *ngIf="!is2FaRequired" class="mt-3">
  <app-two-fa-root></app-two-fa-root>
</div>
