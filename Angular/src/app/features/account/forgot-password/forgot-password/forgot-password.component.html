<div class="container-fluid d-flex justify-content-center align-items-center vh-100">
  <div class="col-md-6">
    <mat-card appearance="outlined" class="text-center">
      <mat-card-content>
        <form [formGroup]="forgotPasswordForm">
          <div class="row pt-5 pb-5">
            <div class="col-lg-6">
              <img src="assets/images/logo-small.png" alt="Logo" class="logo">
            </div>
            <div class="col-lg-6">
              <!-- Center the title and subtitle -->
              <div class="text-center">
                <mat-card-title class="pb-4 fw-bold fs-2">Forgot Your Password?</mat-card-title>
                <mat-card-subtitle>Enter your email to receive a password reset link</mat-card-subtitle>
              </div>
              <!-- Forgot password form -->
              <div class="mt-2">
                <mat-form-field class="w-75">
                  <mat-label>Email</mat-label>
                  <input matInput placeholder="jdeux@example.com" formControlName="email" required autofocus (keyup.enter)="sendPasswordReset()">
                  <mat-error *ngIf="email.invalid && (email.dirty || email.touched)" class="mb-2">
                    A valid email is required
                  </mat-error>
                </mat-form-field>
              </div>
              <p></p>
              <button mat-raised-button color="primary" class="w-75" (click)="sendPasswordReset()">Reset Password</button>
            </div>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
