name: CI

on:
  # Feature branches get coverage via pull_request - open a draft PR on the first commit.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # TODO(template): set SONAR_TOKEN, SONAR_PROJECT_KEY, and SONAR_ORG for your
      # own SonarQube Cloud project.
      - name: Set up JDK
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache SonarQube Cloud packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@v4
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: ${{ env.SONAR_TOKEN != '' && steps.cache-sonar-scanner.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      # Sonar's end step needs the lcov file on this same runner - the client job
      # runs on a separate one, so this duplicates a lightweight test run here just
      # to produce coverage data. Client build/lint/test still run for real in the
      # client job; this doesn't replace that.
      - name: Setup Node
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      # GITHUB_ACTIONS=false stops Vitest from writing its own job summary here - this
      # run is only to feed Sonar coverage data, not a real test result to report; the
      # client job's own test run already produces the real summary.
      - name: Generate client coverage for Sonar
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: client
        env:
          GITHUB_ACTIONS: false
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/ng test --coverage --coverage-reporters lcov --watch=false

      # begin/build/test/end must all run from the same folder, or the MSBuild
      # integration silently fails to pick up any projects - runs from the repo
      # root (not api/) so the scan also covers client/, not just the API.
      # wwwroot is leftover pre-Angular-migration scaffold assets (jQuery, Bootstrap,
      # etc.), not part of the actual SPA - excluded along with the other generated/
      # vendor dirs so vendored code and binaries aren't scanned as our own source.
      # workflow_dispatch runs don't get branch auto-detected by the scanner (a known
      # SonarScanner limitation) and silently analyze as if there's no branch at all -
      # pass it explicitly for any non-PR trigger. PR runs already auto-detect correctly
      # via sonar.pullrequest.*, so leave those alone.
      - name: Begin SonarQube Cloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          BRANCH_ARGS=""
          if [ -z "${{ github.event.pull_request.number }}" ]; then
            BRANCH_ARGS="/d:sonar.branch.name=${{ github.ref_name }}"
          fi
          ./.sonar/scanner/dotnet-sonarscanner begin /k:"${{ vars.SONAR_PROJECT_KEY }}" /o:"${{ vars.SONAR_ORG }}" /d:sonar.token="$SONAR_TOKEN" /d:sonar.qualitygate.wait=true /d:sonar.exclusions="**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/.angular/**,**/wwwroot/**,**/e2e/**" /d:sonar.cs.cobertura.reportsPaths="api/TestResults/**/coverage.cobertura.xml" /d:sonar.javascript.lcov.reportPaths="client/coverage/Angular/lcov.info" $BRANCH_ARGS

      # AngularDotNetAuthTemplate.Api.Tests' integration tests exercise the
      # real auth/2FA/JWT controller flows over HTTP against these
      # containers rather than mocks - same docker-compose.yml used locally.
      - name: Start MySQL, SendGrid mock & SMS mock
        run: docker compose up -d mysql sendgridmock smsmock

      - name: Wait for MySQL to be healthy
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format='{{.State.Health.Status}}' auth-template-mysql 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "MySQL is healthy"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/40)"
            sleep 3
          done
          echo "MySQL did not become healthy in time"
          docker logs auth-template-mysql
          exit 1

      - name: Restore
        run: dotnet restore api/AngularDotNetAuthTemplate.sln

      - name: Build
        run: dotnet build api/AngularDotNetAuthTemplate.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test api/AngularDotNetAuthTemplate.sln --no-build --configuration Release
          --logger "trx" --results-directory api/TestResults --collect:"XPlat Code Coverage"

      - name: End SonarQube Cloud analysis
        id: sonar-end
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Surface quality gate result
        if: ${{ always() && env.SONAR_TOKEN != '' }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            DASHBOARD_URL="https://sonarcloud.io/dashboard?id=${{ vars.SONAR_PROJECT_KEY }}&pullRequest=${{ github.event.pull_request.number }}"
          else
            DASHBOARD_URL="https://sonarcloud.io/dashboard?id=${{ vars.SONAR_PROJECT_KEY }}&branch=${{ github.ref_name }}"
          fi
          if [ "${{ steps.sonar-end.outcome }}" = "failure" ]; then
            echo "### :x: SonarQube Cloud quality gate FAILED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :white_check_mark: SonarQube Cloud quality gate passed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "[View details on SonarQube Cloud]($DASHBOARD_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: api/**/TestResults/*.trx

  client:
    name: Client build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Build
        working-directory: client
        run: npm run build

      - name: Test
        working-directory: client
        run: npm test

  e2e:
    name: End-To-End Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Adds throwaway SeedAdmin credentials on top of docker-compose.yml - local dev
      # gets these from a gitignored appsettings.Development.json that doesn't exist
      # in a fresh CI checkout. See docker-compose.ci.yml for why this isn't just
      # added to docker-compose.yml directly.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Start MySQL, SendGrid mock & SMS mock
        run: docker compose up -d mysql sendgridmock smsmock

      - name: Wait for MySQL to be healthy
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format='{{.State.Health.Status}}' auth-template-mysql 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "MySQL is healthy"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/40)"
            sleep 3
          done
          echo "MySQL did not become healthy in time"
          docker logs auth-template-mysql
          exit 1

      # The api container doesn't run migrations itself (see README's Backend Setup) -
      # a fresh MySQL instance here has no schema at all until this runs.
      - name: Apply database migrations
        working-directory: api
        run: |
          dotnet tool restore
          cd AngularDotNetAuthTemplate.Api
          dotnet ef database update

      # Builds and starts the full SPA + API in one container, the same way the app is
      # actually deployed - not a bare `dotnet run`/`ng serve` port.
      - name: Build and start the full stack
        run: docker compose up -d --build api

      - name: Wait for the app to be reachable
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "App is reachable"
              exit 0
            fi
            echo "Waiting for the app... ($i/40)"
            sleep 3
          done
          echo "App did not become reachable in time"
          docker compose logs api
          exit 1

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      # --with-deps also apt-get installs OS-level shared libraries, which hung on a
      # flaky GitHub Actions apt mirror (azure.archive.ubuntu.com) and burned a full
      # timeout-minutes run. GitHub's ubuntu-latest runners already ship what Chromium
      # needs, so plain `install chromium` (binary download only, no apt/network-mirror
      # involved) should avoid that flakiness entirely.
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install chromium

      - name: Test
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
