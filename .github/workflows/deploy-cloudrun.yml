name: Deploy to Cloud Run

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # TODO(template): a generated repo starts with none of the required GCP/WIF/
    # Aiven/notification-mock variables and secrets set. This job skips until
    # GCP_PROJECT_ID is set, but a deploy needs the rest too. See the full list
    # in docs/DEPLOYMENT.md#using-this-for-your-own-deployment.
    if: vars.GCP_PROJECT_ID != ''
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      # TODO(template): Aiven-specific (pauses/resumes a free-tier instance that
      # suspends when idle). Remove this step and "Wait for Aiven MySQL to be
      # running" below if you're not using Aiven, and point db-connection-string
      # at whatever MySQL-compatible host you're using instead.
      - name: Power on Aiven MySQL
        env:
          AIVEN_API_TOKEN: ${{ secrets.AIVEN_API_TOKEN }}
        run: |
          pip install --only-binary :all: aiven-client==4.18.0
          avn --auth-token "$AIVEN_API_TOKEN" \
            service update ${{ vars.AIVEN_SERVICE_NAME }} \
            --power-on \
            --project ${{ vars.AIVEN_PROJECT }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.ref_name }}"
          docker build -f api/AngularDotNetAuthTemplate.Api/Dockerfile -t "$IMAGE" \
            --build-arg DEMO_BANNER_ENABLED=${{ vars.DEMO_BANNER_ENABLED || 'false' }} \
            --build-arg DEMO_BANNER_REPO_URL=${{ github.server_url }}/${{ github.repository }} \
            --build-arg DEMO_MOCK_EMAIL_URL=${{ vars.SENDGRID_MOCK_URL }} \
            --build-arg DEMO_MOCK_SMS_URL=${{ vars.TWILIO_MOCK_URL }} \
            --build-arg VERSION=${{ github.ref_name }} \
            .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Wait for Aiven MySQL to be running
        env:
          AIVEN_API_TOKEN: ${{ secrets.AIVEN_API_TOKEN }}
        run: |
          pip install --only-binary :all: aiven-client==4.18.0
          for i in $(seq 1 30); do
            status=$(avn --auth-token "$AIVEN_API_TOKEN" \
              service get ${{ vars.AIVEN_SERVICE_NAME }} \
              --project ${{ vars.AIVEN_PROJECT }} \
              --json | jq -r '.state')
            if [ "$status" = "RUNNING" ]; then
              echo "Aiven MySQL is running"
              exit 0
            fi
            echo "Waiting for Aiven MySQL... ($i/30, status: $status)"
            sleep 10
          done
          echo "Aiven MySQL did not reach RUNNING in time"
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run EF Core migrations
        working-directory: api/AngularDotNetAuthTemplate.Api
        run: |
          dotnet tool restore
          CONN_STRING=$(gcloud secrets versions access latest \
            --secret=db-connection-string \
            --project ${{ env.PROJECT_ID }})
          export ConnectionStrings__DefaultConnection="$CONN_STRING"
          dotnet ef database update

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated
          env_vars: |
            Jwt2FaConfig__ValidIssuer=AngularDotNetAuthTemplateAPI
            Jwt2FaConfig__ValidAudience=${{ vars.CLOUD_RUN_URL }}
            Jwt2FaAuthCoreConfig__FrontendBaseUrl=${{ vars.CLOUD_RUN_URL }}
            SendGridEmailConfigs__BaseUrlOverride=${{ vars.SENDGRID_MOCK_URL }}
            TwilioSmsConfigs__BaseUrlOverride=${{ vars.TWILIO_MOCK_URL }}
            SeedAdmin__Email=${{ vars.SEED_ADMIN_EMAIL }}
          secrets: |
            ConnectionStrings__DefaultConnection=db-connection-string:latest
            Jwt2FaConfig__SecurityKey=jwt2fa-security-key:latest
            SeedAdmin__Password=seed-admin-password:latest

      - name: Show deployed URL
        run: echo "${{ steps.deploy.outputs.url }}"
