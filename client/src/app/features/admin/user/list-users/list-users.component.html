<div class="mt-3">
  <mat-card appearance="outlined" class="mt-3 mb-4 ms-2 me-2 mat-elevation-z8 col-md-9">
    <mat-card-header>
      <mat-card-title>Users</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="mt-4 d-flex align-items-center flex-wrap">
        <button mat-raised-button color="primary" (click)="onAddUser()">
          <fa-icon [icon]="icons.userAdd"></fa-icon> Add User
        </button>
        <mat-slide-toggle class="ms-4"
          [checked]="includeInactiveUsers"
          color="primary"
          (change)="onIncludeInactiveUsersChanged($event)">
          <span class="ms-2">Include Inactive Users</span>
        </mat-slide-toggle>
        <mat-form-field class="ms-auto" subscriptSizing="dynamic">
          <mat-label>Search</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Search users" autocomplete="off">
        </mat-form-field>
      </div>

      <table mat-table [dataSource]="dataSource" matSort class="table table-hover w-100">

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="firstName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
          <td mat-cell *matCellDef="let user">{{ user.firstName }}</td>
        </ng-container>

        <ng-container matColumnDef="lastName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
          <td mat-cell *matCellDef="let user">{{ user.lastName }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
          <td mat-cell *matCellDef="let user">{{ user.isActive ? 'Active' : 'Inactive' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let user" class="text-center text-nowrap align-middle">
            <button type="button" class="me-2" mat-mini-fab color="primary" (click)="onDetails(user.id)">
              <fa-icon [icon]="icons.edit"></fa-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center py-3" [attr.colspan]="displayedColumns.length">No users to display</td>
        </tr>
      </table>

      <mat-paginator [pageSize]="10" [hidePageSize]="true" [showFirstLastButtons]="true"></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
