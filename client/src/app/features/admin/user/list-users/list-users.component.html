<div class="mt-3">
  <mat-card appearance="outlined" class="mt-3 mb-4 ms-2 me-2 mat-elevation-z8 col-md-9">
    <!--mat-elevation-z8-->
    <mat-card-header>
      <mat-card-title >Users</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="mt-4">
        <button mat-raised-button color="primary" (click)="onAddUser()">
          <fa-icon [icon]="icons.userAdd"></fa-icon> Add User
        </button>
        <mat-slide-toggle class="ms-4"
          [checked]="includeInactiveUsers"
          color="primary"
          (change)="onIncludeInactiveUsersChanged($event)">
          <span class="ms-2">Include Inactive Users</span>
        </mat-slide-toggle>
      </div>
      <table class="table table-hover"
        datatable
        [dtOptions]="dtOptions"
        [dtTrigger]="dtTrigger">
        <thead>
          <tr>
            <th>Email</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (user of users; track user) {
            <tr>
              <td>{{ user.email }}</td>
              <td>{{ user.firstName }}</td>
              <td>{{ user.lastName }}</td>
              <td>{{ user.isActive ? 'Active' : 'Inactive' }}</td>
              <td class="text-center text-nowrap align-middle">
                <button type="button" class="me-2" mat-mini-fab color="primary" (click)="onDetails(user.id)">
                  <fa-icon [icon]="icons.edit"></fa-icon>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </mat-card-content>
  </mat-card>
</div>
