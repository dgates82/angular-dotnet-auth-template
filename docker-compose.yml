services:
  mysql:
    image: mysql:8
    container_name: auth-template-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: AuthTemplate
      MYSQL_USER: webapp
      MYSQL_PASSWORD: mypass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: auth-template-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  smsmock:
    image: ghcr.io/dgates82/twilio-mock:1.0.0
    container_name: auth-template-sms-mock
    restart: unless-stopped
    ports:
      - "3030:3030" # web UI + Twilio-compatible REST API
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  sendgridmock:
    image: ghcr.io/dgates82/sendgrid-mock:1.0.0
    container_name: auth-template-sendgrid-mock
    restart: unless-stopped
    ports:
      - "3040:3040" # web UI + SendGrid-compatible REST API
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3040/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postmarkmock:
    image: ghcr.io/dgates82/postmark-mock:1.0.0
    container_name: auth-template-postmark-mock
    restart: unless-stopped
    ports:
      - "3050:3050" # web UI + Postmark-compatible REST API
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3050/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: auth-template-localstack
    restart: unless-stopped
    environment:
      - SERVICES=sns
      - DEBUG=0
    ports:
      - "4566:4566" # LocalStack edge port (SNS)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/AngularDotNetAuthTemplate.Api/Dockerfile
    container_name: auth-template-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
      smsmock:
        condition: service_started
    environment:
      # This compose file is local-dev tooling only - don't carry Development into a real deployment config (#6).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=AuthTemplate;User=webapp;Password=mypass"
      SmtpEmailConfigs__Host: mailpit
      TwilioSmsConfigs__BaseUrlOverride: "http://smsmock:3030"
      SendGridEmailConfigs__BaseUrlOverride: "http://sendgridmock:3040"
      PostMarkEmailConfigs__BaseUrlOverride: "http://postmarkmock:3050"
      SnsSmsConfigs__ServiceUrlOverride: "http://localstack:4566"
      Jwt2FaAuthCoreConfig__FrontendBaseUrl: "http://localhost:8080"
    ports:
      - "8080:8080"

volumes:
  mysql_data:
