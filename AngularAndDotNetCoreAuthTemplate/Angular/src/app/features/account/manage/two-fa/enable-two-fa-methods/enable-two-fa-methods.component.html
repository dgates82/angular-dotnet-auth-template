<div class="container-fluid mt-3 mb-4">
  <h2>Choose an authentication method</h2>
  <!--  <h4>In addition to your username and password, you'll need to enter a verification code to sign into your account.</h4>-->

  <div class="row">
    <div class="col-xxl-9 col-lg-10">
      <div class="auth-method-container">
        <mat-radio-group [(ngModel)]="selectedMethod">
          <div
            *ngFor="let method of authMethods"
            class="card auth-method-card p-3 mb-3 border cursor-pointer"
            [ngClass]="{ 'selected': selectedMethod === method.value }"
            (click)="selectMethod(method.value)"
          >
            <div class="d-flex align-items-start">
              <mat-radio-button [value]="method.value" class="me-3"></mat-radio-button>
              <div>
                <div class="d-flex align-items-center mb-2">
                  <h5 class="m-0 fw-bold fs-6">{{ method.label }}</h5>
                  <span *ngIf="method.recommended" class="badge bg-warning text-dark ms-2">RECOMMENDED</span>
                </div>
                <p class="text-muted mb-0">{{ method.description }}</p>
              </div>
            </div>
          </div>
        </mat-radio-group>
      </div>
    </div>
  </div>
  <div class="col-lg-6">
    <button mat-raised-button color="primary" class="w-50" (click)="next()">Next</button>
  </div>

</div>
