
<div *ngIf="!isVerified" class="mt-3 mb-4 col-xxl-9 col-lg-10">
  <h2>Validate Phone Number</h2>

  <div [formGroup]="verifyPhoneForm">
    <div *ngIf="!isCodeSent">
      <mat-form-field class="w-100 mt-2">
        <mat-label>Phone Number</mat-label>
        <input matInput formControlName="phoneNumber" mask="(000) 000-0000" required>
        <mat-error *ngIf="phoneNumber.invalid && (phoneNumber.dirty || phoneNumber.touched)" class="mb-2">
          Invalid phone number
        </mat-error>
      </mat-form-field>
      <button mat-raised-button color="primary" class="w-100 mt-2" (click)="sendCode()">Send Verification Code</button>
    </div>

    <div *ngIf="isCodeSent">
      <mat-form-field class="w-100 mt-2">
        <mat-label>Verification Code</mat-label>
        <input matInput formControlName="code" required mask="000 000" (keyup.enter)="verifyCode()">
        <mat-error *ngIf="code.invalid && (code.dirty || code.touched)" class="mb-2">
          Invalid verification code
        </mat-error>
      </mat-form-field>
      <p></p>

      <div class="mt-3 d-flex justify-content-end">
        <a class="text-primary fw-bold text-decoration-none cursor-pointer" (click)="resendCode()">Resend verification code</a>
      </div>

      <div class="d-flex mt-5">
        <button *ngIf="showBack" mat-raised-button class="w-25 me-2 bg-light" (click)="back()">Back</button>
        <button mat-raised-button color="primary" class="w-75" (click)="verifyCode()">Verify</button>
      </div>
    </div>

  </div>

</div>

<div *ngIf="isVerified" class="mt-3">
  <h2>Your phone number has been verified and 2FA is now enabled.</h2>
</div>
